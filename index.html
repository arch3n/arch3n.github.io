<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Site</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* evita rolagem durante o GIF */
        }

        /* Tela de abertura com o GIF */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black; /* fundo do splash */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        /* Conteúdo do site */
        .main-content {
            opacity: 0;
            transition: opacity 1s ease;
        }

        .main-content.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Splash screen com GIF -->
    <div id="splash">
        <img src="gif.gif" id="gif" alt="Abertura">
    </div>
