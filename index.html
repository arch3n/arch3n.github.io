<body>

    <!-- Camada do fundo que receberá blur -->
    <div id="background-blur"></div>

    <!-- Tela inicial -->
    <div id="intro">
        <img id="intro-gif" src="gif.gif" alt="Intro GIF">
    </div>

    <!-- Conteúdo -->
    <div id="content">
        <h1 class="typewriter" data-text="Bem-vinda!"></h1>
        <p class="typewriter" data-text="Seu texto aqui..."></p>
    </div>

<script>
    setTimeout(() => {
        const gif = document.getElementById("intro-gif");

        // Torna o GIF o fundo
        const bg = document.getElementById("background-blur");
        bg.style.backgroundImage = `url(${gif.src})`;

        // Aplica o blur no fundo
        bg.classList.add("blur");

        // Some com a intro
        document.getElementById("intro").style.opacity = 0;

        setTimeout(() => {
            document.getElementById("intro").style.display = "none";
            document.getElementById("content").style.opacity = 1;

            // Inicia o typewriter
            startTypewriter();
        }, 600);

    }, 5000);

    function startTypewriter() {
        document.querySelectorAll(".typewriter").forEach(el => {
            const text = el.getAttribute("data-text");
            el.textContent = "";
            let i = 0;

            function type() {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }

            type();
        });
    }
</script>
</body>
