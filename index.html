<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-image: url("background.jpg"); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center; /* centraliza vertical */
    }

    /* Splash */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.4s ease; /* fade-out mais rápido */
    }

    /* Conteúdo do site (texto centralizado) */
    .main-content {
      opacity: 0;
      transition: opacity 0.6s ease;
      color: white;
      text-align: center;
      padding: 20px;
      max-width: 900px;
    }

    .main-content.visible {
      opacity: 1;
    }

    img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <img src="gif.gif" alt="Abertura">
  </div>

  <!-- Conteúdo -->
  <div class="main-content" id="content">
    <h1>Bem-vindo!</h1>
    <p>O texto agora está centralizado no meio da tela, sem caixa visível!</p>
  </div>

  <script>
    const GIF_DURATION = 1000; // 5 segundos independente do GIF

    window.onload = () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        const content = document.getElementById('content');

        // fade-out rápido (0.4s)
        splash.style.opacity = 0;

        setTimeout(() => {
          splash.style.display = "none";
          content.classList.add("visible");
          document.body.style.overflow = "auto";
        }, 400); // igual ao tempo do fade
      }, GIF_DURATION);
    };
  </script>

</body>
</html>
