<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Site</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;

      /* Começa com um fundo provisório (preto) */
      background-color: black;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      font-family: Arial, sans-serif;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Splash */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Conteúdo centralizado */
    .main-content {
      opacity: 0;
      transition: opacity 1s ease;
      color: white;
      text-align: center;
      padding: 20px;
      max-width: 900px;
      z-index: 1;
    }

    .main-content.visible {
      opacity: 1;
    }

  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <img id="gifElement" src="gif.gif" alt="Abertura">
  </div>

  <!-- Conteúdo -->
  <div class="main-content" id="content">
    <h1>Bem-vindo!</h1>
    <p>Agora o GIF continua como fundo animado do site.</p>
  </div>

  <script>
    const GIF_DURATION = 5000; // 5 segundos

    window.onload = () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        const content = document.getElementById('content');
        const gif = document.getElementById('gifElement').src;

        /* TROCA O FUNDO DO SITE PARA O GIF */
        document.body.style.backgroundImage = `url('${gif}')`;

        /* remove o splash instantaneamente (sem fade) */
        splash.style.display = "none";

        /* mostra o conteúdo */
        content.classList.add("visible");
        document.body.style.overflow = "auto";

      }, GIF_DURATION);
    };
  </script>

</body>
</html>
