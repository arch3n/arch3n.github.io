<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A QUEDA</title>

  <style>
    :root {
      --blur-amount: 8px;
      --type-speed: 50; /* ms por caractere */
    }

    html, body {
      height: 100%;
      margin: 0;
      background-color: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    /* CAMADA DO FUNDO */
    #background-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      transition: filter 0.8s ease, opacity 0.6s ease;
      opacity: 1;
    }

    /* blur aplicado só depois */
    #background-layer.blurred {
      filter: blur(var(--blur-amount));
    }

    /* INTRO GIF */
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 20;
      transition: opacity 0.6s ease;
    }

    #intro img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* TEXTO CENTRAL */
    #content {
      position: relative;
      z-index: 30;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    #content.visible {
      opacity: 1;
    }

    #choice-buttons {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 8px;
      background: #ffffffcc;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .15s;
    }

    button:hover {
      transform: scale(1.06);
    }

    /* Conteúdo adicional (SIM) */
    #extra-content {
      opacity: 0;
      visibility: hidden;
      transition: opacity .6s ease;
      margin-top: 2rem;
    }

    #extra-content.visible {
      opacity: 1;
      visibility: visible;
    }

    /* BLOCO "NÃO" */
    #block-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      color: white;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.5rem;
      padding: 1rem;
    }
  </style>
</head>

<body>

<div id="block-screen">
    <div>
        <h1>Volte quando estiver preparado.</h1>
        <p><strong>Ctrl + R</strong></p>
    </div>
</div>

<!-- Fundo (recebe o gif depois) -->
<div id="background-layer"></div>

<!-- Intro GIF -->
<div id="intro">
    <img id="intro-gif" src="gif.gif" alt="Intro">
</div>

<!-- Conteúdo -->
<main id="content">
    <h1 class="typewriter" data-text="Bem vindo."></h1>
    <p class="typewriter" data-text="Me diga, você está preparado para a queda?"></p>

    <div id="choice-buttons">
        <button id="btn-yes">Sim</button>
        <button id="btn-no">Não</button>
    </div>

    <div id="extra-content">
        <h2>Ótimo. Vamos começar.</h2>
        <p></p>
    </div>
</main>

<script>
(function () {
  const INTRO_TIME = 1000; // ← 1s
  const FADE_OUT_MS = 600;

  const intro = document.getElementById('intro');
  const introGif = document.getElementById('intro-gif');
  const bg = document.getElementById('background-layer');
  const content = document.getElementById('content');
  const extra = document.getElementById("extra-content");
  const block = document.getElementById("block-screen");

  let gifLoaded = false;

  introGif.addEventListener('load', () => gifLoaded = true);
  introGif.addEventListener('error', () => gifLoaded = false);
  if (introGif.complete && introGif.naturalWidth !== 0) gifLoaded = true;

  function setBackground(src) {
    bg.style.backgroundImage = `url('${src}')`;
    bg.style.backgroundSize = "cover";
    bg.style.backgroundPosition = "center";
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      const src = gifLoaded ? introGif.src : 'background.jpg';

      setBackground(src);
      bg.classList.add('blurred'); // BLUR NO FUNDO

      intro.style.opacity = "0";

      setTimeout(() => {
        intro.style.display = "none";
        content.classList.add("visible");
        startTypewriter();
      }, FADE_OUT_MS);

    }, INTRO_TIME);
  });

  /* TYPEWRITER */
  function startTypewriter() {
    const els = document.querySelectorAll('.typewriter');
    els.forEach(el => {
      const text = el.dataset.text;
      el.textContent = "";
      let i = 0;
      function step() {
        if (i < text.length) {
          el.textContent += text[i++];
          setTimeout(step, 50);
        }
      }
      step();
    });
  }

  /* BOTÕES */
  document.getElementById("btn-yes").addEventListener("click", () => {
    extra.classList.add("visible");
  });

  document.getElementById("btn-no").addEventListener("click", () => {
    block.style.display = "flex";
  });

})();
</script>

</body>
</html>
