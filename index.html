<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Site</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("background.jpg"); /* imagem de fundo */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background-color: rgba(255, 255, 255, 0.8); /* leve transparência */
            padding: 20px;
            border-radius: 10px;
        }

        img {
            max-width: 100%;
            margin: 10px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Bem-vindo ao Meu Site!</h1>
        <p>Aqui posso adicionar imagens livremente:</p>

        <!-- Exemplo de imagens -->
        <img src="img1.png" alt="Imagem 1">
        <img src="img2.jpg" alt="Imagem 2">
        <img src="img3.png" alt="Imagem 3">

    </div>
</body>
</html>
