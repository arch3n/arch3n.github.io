<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A QUEDA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --blur-amount: 8px;
    }

    html, body {
      height: 100%;
      margin: 0;
      background-color: #000;
      font-family: "Geo", monospace; 
      color: #fff;
      overflow: hidden; 
      text-transform: uppercase;
    }

    /* --- CAMADA DE FUNDO --- */
    #background-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      transition: filter 0.8s ease, opacity 0.6s ease;
      opacity: 1;
    }

    #background-layer.blurred {
      filter: blur(var(--blur-amount));
    }

    .fade-to-black {
      opacity: 0 !important; 
      transition: opacity 2.5s ease-in-out !important; 
    }

    /* --- TELA DE INTRO --- */
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 20;
      transition: opacity 0.6s ease;
    }

    #intro img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --- CONTEÚDO PRINCIPAL --- */
    #content {
      position: relative;
      z-index: 30;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    #content.visible {
      opacity: 1;
    }

    /* --- EFEITOS DE TEXTO --- */
    @keyframes static-vibrate {
      0% { text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; }
      25% { text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; }
      50% { text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; }
      75% { text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; }
      100% { text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; }
    }

    .glitch-text { animation: static-vibrate 0.1s infinite; }

    .typewriter {
        font-size: 2.5rem; 
        margin-bottom: 1rem;
        letter-spacing: 2px; 
    }
    
    p.typewriter { font-size: 1.5rem; }

    /* --- BOTÕES INICIAIS --- */
    #choice-buttons {
      margin-top: 3rem;
      display: flex;
      gap: 2rem;
    }

    button {
      padding: 1rem 2.5rem; 
      border: none;
      border-radius: 4px;
      background: #ffffffcc;
      color: #000;
      font-size: 1.5rem; 
      cursor: pointer;
      transition: transform .15s, background .2s;
      font-weight: bold;
      min-width: 120px; 
      font-family: "Geo", monospace; 
      text-transform: uppercase; 
    }

    button:hover { transform: scale(1.1); }

    /* --- BUG DO BOTÃO "NÃO" --- */
    @keyframes glitch-anim {
      0% { transform: translate(0) skew(0deg); }
      20% { transform: translate(-2px, 2px) skew(-10deg); }
      40% { transform: translate(-2px, -2px) skew(10deg); }
      60% { transform: translate(2px, 2px) skew(-5deg); }
      80% { transform: translate(2px, -2px) skew(5deg); }
      100% { transform: translate(0) skew(0deg); }
    }

    .bug-effect { animation: glitch-anim 0.2s infinite; }

    /* --- QUEDA --- */
    @keyframes free-fall {
      0% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0px); }
      100% { transform: translateY(-200vh) scale(0.8); opacity: 0; filter: blur(10px); }
    }

    .falling {
      animation: free-fall 2.5s forwards cubic-bezier(0.6, 0.04, 0.98, 0.335);
      pointer-events: none; 
    }

    /* --- EXTRA CONTENT --- */
    #extra-content {
      opacity: 0;
      visibility: hidden;
      transition: opacity .6s ease;
      margin-top: 3rem;
    }

    #extra-content.visible {
      opacity: 1;
      visibility: visible;
    }
    
    #extra-content h2 { font-size: 2.5rem; }
    #extra-content p { font-size: 1.5rem; }

    /* --- SISTEMA DE QUIZ --- */
    #quiz-container {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 2rem;
    }

    #quiz-container.active {
      display: flex;
      animation: fade-in 2s ease forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Imagem da Pergunta */
    #quiz-image {
        max-width: 100%;
        max-height: 400px;
        margin-bottom: 1.5rem;
        border: 2px solid #ffffff;
        display: none; /* Escondido por padrão */
        object-fit: contain;
        box-shadow: 0 0 15px #ffffff;
    }
    /* Estilo do Título Fixo do Quiz */
    .quiz-header {
        font-size: 3rem; /* Bem grande */
        color: #fff;
        margin-bottom: 2rem;
        text-align: center;
        text-shadow: 0 0 10px #ffffff; /* Brilho verde hacker */
        line-height: 1.1;
        width: 100%;
    }
    
    /* Ajuste para celular (opcional, para não quebrar a tela) */
    @media (max-width: 600px) {
        .quiz-header {
            font-size: 2rem;
        }
    }
    #quiz-question {
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #ffffff;
      text-shadow: 0 0 5px #ffffff;
    }
    #quiz-content {
        display: flex;
        flex-direction: column;
        align-items: center; /* Centraliza imagem, pergunta e opções */
        width: 100%;
    }
    /* CONFIGURAÇÃO DOS BOTÕES LADO A LADO */
    #quiz-options {
      display: grid;              /* Ativa o modo Grade */
      grid-template-columns: 1fr 1fr; /* Cria 2 colunas de tamanho igual */
      gap: 1rem;                  /* Espaço entre os botões */
      width: 100%;
      max-width: 700px;           /* Aumentei um pouco a largura total para caber melhor */
      margin: 0 auto;             /* Centraliza o bloco na tela */
    }

    /* Ajuste para celular: se a tela for pequena, volta a ficar um embaixo do outro */
    @media (max-width: 600px) {
        #quiz-options {
            grid-template-columns: 1fr; /* 1 coluna apenas no celular */
        }
    }

    .quiz-btn {
      padding: 1rem;
      background: transparent;
      border: 1px solid #ffffff;
      color: #ffffff;
      font-family: "Geo", monospace;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .quiz-btn:hover {
      background: #ffffff;
      color: #000;
      box-shadow: 0 0 15px #ffffff;
    }

    /* --- LAYOUT DO RESULTADO FINAL (Novo Design) --- */
    
    #final-layout {
        display: flex;
        gap: 2rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        align-items: stretch; /* Estica as colunas para mesma altura */
    }

    /* Coluna da Esquerda (Tarot - Retângulo Vertical) */
    .left-col {
        flex: 1; /* Ocupa 1 parte do espaço */
        display: flex;
        flex-direction: column;
    }

    /* Coluna da Direita (Signo + Form - Retângulo Horizontal) */
    .right-col {
        flex: 1.5; /* Ocupa 1.5 partes (mais largo) */
        display: flex;
        flex-direction: column;
        gap: 2rem; /* Espaço entre o Signo e o Input */
    }

    /* Estilo dos Cards */
    .result-card {
        border: 2px solid #ffffff;
        padding: 1.5rem;
        background: rgba(0, 0, 0, 0.7);
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%; /* Preenche a coluna */
    }

    /* Imagens dentro dos cards */
    .result-card img {
        max-width: 100%;
        object-fit: contain;
        border: 1px solid #ffffff;
        margin-bottom: 1rem;
    }

    .result-card h3 {
        color: #ffffff;
        font-size: 1.8rem;
        margin: 0.5rem 0;
    }

    .result-card p {
        font-size: 1.1rem;
        color: #ddd;
    }

    /* Ajuste específico para a imagem do Tarot (Vertical) */
    .tarot-img {
        height: 400px !important; 
    }

    /* Ajuste específico para a imagem do Signo (Horizontal) */
    .sign-img {
        height: 200px !important; 
        width: 100%;
    }

    /* Área do Formulário (Canto Inferior Direito) */
    #input-area {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        padding: 1rem;
    }

    /* O Input (A Linha no desenho) */
    #player-name {
        background: transparent;
        border: none;
        border-bottom: 4px solid #ffffff; /* A linha grossa */
        color: #fff;
        font-family: "Geo", monospace;
        font-size: 2rem;
        text-align: left; /* Digita da esquerda */
        outline: none;
        padding: 0.5rem;
        width: 100%;
        text-transform: uppercase;
    }
    #player-name::placeholder { color: #ffffff55; text-align: center; }

    /* O Botão (O Retângulo pequeno embaixo) */
    #btn-submit {
        background: transparent;
        color: #ffffff;
        border: 2px solid #ffffff; /* Borda grossa */
        padding: 1rem;
        font-size: 1.5rem;
        cursor: pointer;
        transition: 0.3s;
        width: 100%; 
        text-transform: uppercase;
        font-weight: bold;
    }
    
    #btn-submit:hover {
        background: #ffffff;
        color: #000;
        box-shadow: 0 0 15px #ffffff;
    }

    /* Responsivo para Celular (Empilha tudo) */
    @media (max-width: 768px) {
        #final-layout {
            flex-direction: column;
        }
        .left-col, .right-col {
            flex: auto;
            width: 100%;
        }
    }

  </style>
</head>

    els.forEach(el => {
      const text = el.dataset.text;
      el.textContent = "";
      let i = 0;
      function step() {
        if (i < text.length) {
          el.textContent += text[i++];
          setTimeout(step, 50);
        } else {
            finishedCount++;
            if(finishedCount === els.length) startPassiveGlitchSystem(); 
        }
      }
      step();
    });
  }

  function startPassiveGlitchSystem() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*<>?[]{}";
    function triggerGlitch() {
        const visibleElements = Array.from(document.querySelectorAll('.glitch-text'))
            .filter(el => el.offsetParent !== null && el.textContent.length > 0);
        
        if (visibleElements.length === 0) { scheduleNextGlitch(); return; }

        const randomEl = visibleElements[Math.floor(Math.random() * visibleElements.length)];
        const originalText = randomEl.textContent;
        const textArray = originalText.split('');
        const glitchCount = Math.floor(Math.random() * 2) + 1; 

        for(let k=0; k<glitchCount; k++){
            const index = Math.floor(Math.random() * textArray.length);
            if(textArray[index] !== ' ') {
                textArray[index] = chars[Math.floor(Math.random() * chars.length)];
            }
        }
        randomEl.textContent = textArray.join('');
        
        setTimeout(() => {
            randomEl.textContent = originalText;
            scheduleNextGlitch(); 
        }, Math.random() * 100 + 50);
    }
    function scheduleNextGlitch() {
        setTimeout(triggerGlitch, Math.random() * 2000 + 1000);
    }
    scheduleNextGlitch();
  }

  /* =========================================
     5. TRANSIÇÃO (QUEDA)
     ========================================= */
function activateContent() {
      // --- LÓGICA DE ÁUDIO ---
      const audio = document.getElementById("bg-audio");
      audio.volume = 0.1; // Volume
      audio.play().catch(error => console.log("O navegador bloqueou o áudio: ", error));
      // -------------------------------

      extra.classList.add("visible");
      setTimeout(() => {
          content.classList.add("falling");
          bg.classList.add("fade-to-black");
          setTimeout(initQuiz, 2500);
      }, 2000); 
  }
  /* =========================================
     6. LÓGICA DO QUIZ (DUPLO RESULTADO)
     ========================================= */
  function initQuiz() {
      content.style.display = "none"; 
      quizContainer.classList.add("active"); 

      // Zera pontuação
      userScores = {};

      // Sorteia perguntas (aqui estamos usando TODAS as perguntas aleatórias)
      const shuffled = allQuestions.sort(() => 0.5 - Math.random());
      
      runQuizLoop(shuffled, 0);
  }

  function runQuizLoop(questions, index) {
      if (index >= questions.length) {
          calculateAndShowResult();
          return;
      }

      const q = questions[index];
      questionEl.innerText = q.text;
      optionsEl.innerHTML = ""; 

      // Controle da Imagem
      if (q.image && q.image.trim() !== "") {
          quizImageEl.src = q.image;
          quizImageEl.style.display = "block"; 
      } else {
          quizImageEl.style.display = "none";
          quizImageEl.src = "";
      }

      const shuffledOptions = q.options.sort(() => 0.5 - Math.random());

      shuffledOptions.forEach(opt => {
          const btn = document.createElement("button");
          btn.innerText = opt.text;
          btn.className = "quiz-btn";
          
          btn.onclick = () => {
              if (opt.weights) {
                  for (const [type, points] of Object.entries(opt.weights)) {
                      // Inicializa se não existir
                      if (!userScores[type]) userScores[type] = 0;
                      userScores[type] += points;
                  }
              }
              runQuizLoop(questions, index + 1);
          };
          
          optionsEl.appendChild(btn);
      });
  }

  function calculateAndShowResult() {
      // 1. Calcula Vencedor da Lista 1 (SIGNO)
      let max1 = -1;
      let winnerKey1 = Object.keys(LIST_1)[0]; 
      
      for (const key of Object.keys(LIST_1)) {
          const score = userScores[key] || 0;
          if (score > max1) { max1 = score; winnerKey1 = key; }
      }
      finalResult1 = LIST_1[winnerKey1];

      // 2. Calcula Vencedor da Lista 2 (TAROT)
      let max2 = -1;
      let winnerKey2 = Object.keys(LIST_2)[0]; 

      for (const key of Object.keys(LIST_2)) {
          const score = userScores[key] || 0;
          if (score > max2) { max2 = score; winnerKey2 = key; }
      }
      finalResult2 = LIST_2[winnerKey2];

      // 3. Monta o HTML FINAL COM O NOVO LAYOUT
      quizContent.style.display = "none";
      finalForm.style.display = "block"; // Muda para block para aceitar layout customizado

      finalForm.innerHTML = ""; // Limpa

      const layoutHTML = `
        <div id="final-layout">
            
            <div class="left-col">
                <div class="result-card">
                    <h3 class="glitch-text" style="color:#ffffff">${finalResult2.title}</h3>
                    <img src="${finalResult2.image}" class="tarot-img" alt="${finalResult2.title}">
                    <p>${finalResult2.desc}</p>
                </div>
            </div>

            <div class="right-col">
                
                <div class="result-card">
                    <h3 class="glitch-text" style="color:#ffffff">${finalResult1.title}</h3>
                    <img src="${finalResult1.image}" class="sign-img" alt="${finalResult1.title}">
                    <p>${finalResult1.desc}</p>
                </div>

                <div id="input-area">
                    <input type="text" id="player-name" placeholder="DIGITE SEU NOME" autocomplete="off">
                    <button id="btn-submit">ENVIAR DADOS</button>
                </div>

            </div>
        </div>
      `;

      finalForm.innerHTML = layoutHTML;

      // RECONECTA O BOTÃO
      document.getElementById("btn-submit").addEventListener("click", submitData);
  }

  // Função de Envio (Separada para ser chamada no novo HTML)
  function submitData() {
      const nameInput = document.getElementById("player-name");
      const submitBtn = document.getElementById("btn-submit");
      const name = nameInput.value.trim();
      
      if(!name) {
          alert("IDENTIFICAÇÃO NECESSÁRIA.");
          return;
      }

      submitBtn.innerText = "ENVIANDO...";
      submitBtn.disabled = true;

      // [ATENÇÃO] COLE SUA URL DO FORMSPREE AQUI
      const ENDPOINT = "https://formspree.io/f/mqardbgk"; 

      const dataToSend = {
          name: name,
          signo: finalResult1.title,
          tarot: finalResult2.title,
          full_scores: JSON.stringify(userScores),
          _subject: `Novo: ${name} (${finalResult1.title} + ${finalResult2.title})`
      };

      fetch(ENDPOINT, {
          method: "POST",
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify(dataToSend)
      })
      .then(response => {
          if (response.ok) {
              const finalDiv = document.getElementById("final-layout");
              finalDiv.innerHTML = `
                  <div style="width:100%; text-align:center; padding: 4rem;">
                      <h2 class='glitch-text' style='color:#ffffff; font-size: 3rem;'>REGISTRO CONFIRMADO.</h2>
                      <p style="font-size: 1.5rem; margin-top: 1rem;">VOCÊ FAZ PARTE DO SISTEMA AGORA.</p>
                  </div>
              `;
          } else {
              throw new Error("Erro no servidor");
          }
      })
      .catch(error => {
          console.error("Erro:", error);
          alert("ERRO NA TRANSMISSÃO.");
          submitBtn.innerText = "ENVIAR DADOS";
          submitBtn.disabled = false;
      });
  }

  /* =========================================
     8. BOTÕES INICIAIS
     ========================================= */
  btnYes.addEventListener("click", activateContent);
  
  btnNo.addEventListener("mouseover", () => {
      if (btnNo.dataset.transformed === "true") return; 
      btnNo.dataset.transformed = "true"; 
      btnNo.classList.add("bug-effect"); 
      const targetText = "Sim";
      const possibleChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*"; 
      let iteration = 0;
      const interval = setInterval(() => {
          btnNo.innerText = targetText.split("").map((l, i) => i < iteration ? targetText[i] : possibleChars[Math.floor(Math.random() * possibleChars.length)]).join("");
          if(iteration >= targetText.length) { 
              clearInterval(interval);
              btnNo.innerText = targetText; 
              btnNo.classList.remove("bug-effect"); 
          }
          iteration += 1 / 3; 
      }, 50); 
  });
  btnNo.addEventListener("click", activateContent);

})();
</script>
